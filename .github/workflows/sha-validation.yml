name: SHA Validation
run-name: SHA Validation - ${{ github.event_name }} (${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      fail_deploy:
        description: "Simulate Deploy Failure"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force:
        description: "Force run all jobs (ignore previous success)"
        required: false
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

jobs:

  check-jobs:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      skip_build: ${{ steps.check.outputs.skip_build }}
      skip_sonar: ${{ steps.check.outputs.skip_sonar }}
      skip_security: ${{ steps.check.outputs.skip_security }}
      skip_package: ${{ steps.check.outputs.skip_package }}
      skip_deploy: ${{ steps.check.outputs.skip_deploy }}
    steps:
      - name: Check commit statuses for this SHA
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // The ONLY thing we key on: the real commit SHA.
            // pull_request -> github.sha is a merge commit, so use the PR head sha.
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;

            console.log(`Event: ${context.eventName}`);
            console.log(`Real commit SHA: ${sha}`);
            core.setOutput('sha', sha);

            // Latest status per context, attached to THIS commit.
            const { data } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            const state = {};
            for (const s of data.statuses) state[s.context] = s.state;

            for (const job of ['build', 'sonar', 'security', 'package', 'deploy']) {
              const done = state[`ci/${job}`] === 'success';
              console.log(`${job}: ${done ? 'already succeeded on this commit' : 'will run'}`);
              core.setOutput(`skip_${job}`, done ? 'true' : 'false');
            }

  build:
    needs: check-jobs
    if: ${{ github.event.inputs.force == 'true' || needs.check-jobs.outputs.skip_build != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: |
          echo "Running Build"
          sleep 10
          echo "Build Success"
      - name: Mark build succeeded
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.check-jobs.outputs.sha }}',
              state: 'success',
              context: 'ci/build',
              description: 'Build completed',
            });

  sonar:
    needs: [check-jobs, build]
    if: ${{ !cancelled() && needs.build.result != 'failure' && (github.event.inputs.force == 'true' || needs.check-jobs.outputs.skip_sonar != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Sonar Scan
        run: |
          echo "Running Sonar Scan"
          sleep 10
          echo "Sonar Success"
      - name: Mark sonar succeeded
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.check-jobs.outputs.sha }}',
              state: 'success',
              context: 'ci/sonar',
              description: 'Sonar completed',
            });

  security:
    needs: [check-jobs, sonar]
    if: ${{ !cancelled() && needs.sonar.result != 'failure' && (github.event.inputs.force == 'true' || needs.check-jobs.outputs.skip_security != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Security Scan
        run: |
          echo "Running Security Scan"
          sleep 10
          echo "Security Success"
      - name: Mark security succeeded
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.check-jobs.outputs.sha }}',
              state: 'success',
              context: 'ci/security',
              description: 'Security completed',
            });

  package:
    needs: [check-jobs, security]
    if: ${{ !cancelled() && needs.security.result != 'failure' && (github.event.inputs.force == 'true' || needs.check-jobs.outputs.skip_package != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Package
        run: |
          echo "Packaging Application"
          sleep 10
          echo "Package Success"
      - name: Mark package succeeded
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.check-jobs.outputs.sha }}',
              state: 'success',
              context: 'ci/package',
              description: 'Package completed',
            });

  deploy:
    needs: [check-jobs, build, sonar, security, package]
    if: ${{ !cancelled() && needs.build.result != 'failure' && needs.sonar.result != 'failure' && needs.security.result != 'failure' && needs.package.result != 'failure' && (github.event.inputs.force == 'true' || needs.check-jobs.outputs.skip_deploy != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: |
          echo "Deploying Application"
          # fail_deploy only exists for manual dispatch; on PR it's empty -> deploy proceeds
          if [ "${{ github.event.inputs.fail_deploy }}" = "true" ]; then
            echo "Simulating deployment failure"
            exit 1
          fi
          echo "Deploy Success"
      - name: Mark deploy succeeded
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.check-jobs.outputs.sha }}',
              state: 'success',
              context: 'ci/deploy',
              description: 'Deploy completed',
            });
